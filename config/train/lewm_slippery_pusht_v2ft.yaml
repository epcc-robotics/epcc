# lewm_slippery_pusht_v2ft.yaml — predictor-only fine-tune on corpus v2.
#
# Fork of lewm_slippery_pusht.yaml (2026-06-10, memory project_slippery_data_audit_2026_06_10):
#   - data: corpus v2 = play 4000 (teleop 100 EXCLUDED) + noise_play_n2000
#     (CEM-exploit-region coverage: WM err there was 0.184 h1 vs demo 0.004)
#   - finetune_from lewm_object.ckpt + freeze_encoder: encoder+projector frozen
#     (params + BN stats) -> 192-d latent space bit-preserved; only predictor/
#     action_encoder/pred_proj learn. All existing refs/decoders stay valid.
#   - max_epochs 10 (fine-tune, not from-scratch 100)

# NOTE: data group must come BEFORE _self_ so the data.dataset block at the
# bottom of this file overrides the group (v2 corpus name).
defaults:
  - data: slippery_pusht
  - _self_

output_model_name: lewm_slippery_d035_v2ft
subdir: ${hydra:job.id}

finetune_from: ${oc.env:STABLEWM_HOME}/checkpoints/slippery_pusht/lewm/lewm_object.ckpt
freeze_encoder: true

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 15
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 256
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    project: lewm-slippery-v2
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

data:
  dataset:
    name: slippery_pusht/data/slippery_pusht_wm_corpus_v2
    cache_dir: ${oc.env:STABLEWM_HOME}
