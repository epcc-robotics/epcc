# @package _global_
# cube_dp via the in-process unified eval loop.
defaults:
  - /task: cube
  - /policy: dp
  - _self_

seed: 42
cache_dir: ${oc.env:STABLEWM_HOME}

output:
  run_name: cube_dp_v2_n50_verify
  findings_dir: findings/260521_baseline_setup
  logdir_subkey: cube_dp_v2

diffusion:
  # cube CleanDiffuser pixel-DP (dp_cube_aw_image step90k, farm cube/dp/42)
  ckpt_path: ${cache_dir}/cube/dp/models/model_90000.pt
  train_h5_path: ${cache_dir}/datasets/cube_multiview_diffusion_c0.3_postpad_fullscale.h5
  nn: chi_unet
  horizon: 16
  obs_steps: 2
  action_steps: 8
  action_dim: 5
  image_size: 96
  n_views: 2
  crop_shape: [84, 84]
  sample_steps: 50
  use_group_norm: true
  use_seq: true

debug:
  decoder_checkpoint: null

plan_config:
  horizon: 5
  receding_horizon: 15
  action_block: 1
  use_past_context: true

solver:
  inner_solver:
    physical_dim: 5
    n_steps: 30

# Borrowed from config/eval/multiview_cube_base.yaml — needed by legacy
# _setup_eval_world. Same values as v1 cube_dp via multiview_cube_mpcc.
world:
  env_name: ${task.env_name}
  num_envs: ${eval.num_eval}
  max_episode_steps: 200
  history_size: 3
  frame_skip: 5
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true

dataset:
  stats: ${task.dataset_stats}
  keys_to_cache:
    - action

full: true

eval:
  num_eval: ${task.num_eval}
  eval_budget: ${task.eval_budget}
  dataset_name: ${task.dataset_name}
  goal_offset_steps: ${task.goal_offset_steps}
  debug_video: false
  start_offset: 5
  img_size: 224
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: false
        target_pos:
          value: goal_privileged_target_block_pos
        target_quat:
          value: goal_privileged_block_0_quat
