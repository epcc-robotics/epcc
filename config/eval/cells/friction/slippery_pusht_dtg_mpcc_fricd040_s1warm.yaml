# @package _global_
# Arm B of the friction sweep, damping 0.4 — H84/K6/stride-1 generator + warm ring
# (2026-09-07 redo of slippery_pusht_dtg_mpcc_fricd040.yaml; see
# gen_friction_armB_cells_s1warm.sh for what moved and what did not).
defaults:
  - ../slippery_pusht_dtg_mpcc
  - override /policy: dtg_mpcc_warm
  - _self_

task:
  policy_config_group: fricd040

dataset:
  stats: slippery_pusht/data/friction_d040_excised

solver:
  inner_solver:
    action_clamp: [5.0131, 5.1429]
  reference:
    stride: 1

diffusion:
  ckpt_path: ${cache_dir}/checkpoints/friction/d040/diffusion_cd_s1H84/pusht_latent_velloss/A_mm_s1H84_plaindemo_fricd040/42/models/selected_val.pt

world:
  damping: 0.4
  escapable_block: true

eval:
  save_traj: true

warm_ring:
  enabled: true
  latent_h5: ${cache_dir}/slippery_pusht/data/latent/expert_slow_050_n200_d035_park_latents_lewm_fricd040.h5
