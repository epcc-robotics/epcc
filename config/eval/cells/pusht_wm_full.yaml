# @package _global_
# In-process pusht_wm_full via the v2 unified eval loop. Reuses the generic
# policy.wm_full.WMFullPolicy by overriding `legacy_policy_cls` to swm's
# single-view WorldModelPolicy. Mirrors pusht_gt_mpcc but uses
# mpc_pusht solver (CEM in WM, terminal cost only — no reference tracking).
#
# Lessons from pusht_gt_mpcc reproduction (260524):
#   - resolution: 224 (PushT WM trained at 224×224)
#   - full: true (chunk spans full episode, reference reaches goal)
#   - force_pusht_fixed_goal in eval_unified.py overrides synthesized goal
defaults:
  - /task: pusht
  - /policy: wm_full
  - /solver: mpc_pusht
  - _self_

seed: 42
cache_dir: ${oc.env:STABLEWM_HOME}

output:
  run_name: pusht_wm_full_v2_inproc_n47_verify
  findings_dir: findings/260521_baseline_setup
  logdir_subkey: pusht_wm_full_v2_inproc

task:
  # checkpoints/pusht_wm/lewm_object.ckpt, consistent with other pusht cells
  policy_config_group: pusht_wm/lewm
  control_timestep_s: 0.1

policy:
  legacy_policy_cls: stable_worldmodel.policy.WorldModelPolicy

# Terminal-cost MPC: no reference tracking, only the final-step goal cost.
solver:
  cost_weights:
    tracking: 0.0
    terminal: 1.0

debug:
  decoder_checkpoint: null

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5
  use_past_context: true

world:
  env_name: ${task.env_name}
  num_envs: ${eval.num_eval}
  max_episode_steps: ${task.eval_budget}
  history_size: 3             # PushT WM trained with H=3
  frame_skip: 1
  resolution: 224             # PushT WM trained at 224×224

dataset:
  stats: ${task.dataset_stats}
  keys_to_cache:
    - action
    - proprio
    - state

full: true

eval:
  num_eval: ${task.num_eval}
  eval_budget: ${task.eval_budget}
  dataset_name: ${task.dataset_name}
  goal_offset_steps: 25
  debug_video: false
  start_offset: 5             # unify all baselines at train-distribution init
  img_size: 224
  # _set_state only — goal_state forced via force_pusht_fixed_goal.
  callables:
    - method: _set_state
      args:
        state:
          value: state
