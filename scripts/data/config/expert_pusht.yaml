defaults:
  - _self_

world:
  num_envs: 1  # must be 1 for lerobot DP (internal obs queue is single-env)
  max_episode_steps: 300
  image_shape: [224, 224]

# Data collection config
slowdown_factor: 0.5  # slowdown factor (1.0 = normal speed), < 1 for slower expert demos
num_traj: 50
seed: 3072
dataset_name: expert_demo_test
device: cuda

# LeRobot pretrained diffusion policy config
lerobot:
  revision: "v1.1"
  repo_id: "lerobot/diffusion_pusht"
  num_inference_steps: 10
  # Model architecture
  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8
  vision_backbone: "resnet18"
  crop_shape: [84, 84]
  use_group_norm: true
  spatial_softmax_num_keypoints: 32
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: true
  num_train_timesteps: 100
  beta_schedule: "squaredcos_cap_v2"
  prediction_type: "epsilon"
  clip_sample: true
  clip_sample_range: 1.0
  # Normalization stats (from v1.1 checkpoint)
  norm:
    img_mean: 0.5
    img_std: 0.5
    state_min: [13.4564, 32.9383]
    state_max: [496.1462, 510.9579]
    action_min: [12.0, 25.0]
    action_max: [511.0, 511.0]
  action_scale: 100.0  # swm PushT action_scale
